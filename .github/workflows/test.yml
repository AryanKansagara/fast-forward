name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m fast_forward --mode compare
      - run: python -m fast_forward recorded-view docs/recorded-fixture.json
      - run: python -m fast_forward paired-replay docs/recorded-fixture.json
